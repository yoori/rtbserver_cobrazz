  uint32 portions_number = 3;
  string channel_types = 4;
  string channel_statuses = 5;
  bool provide_ccg_links = 6;
  bool provide_channel_triggers = 7;
  bool provide_overlap_channel_ids = 8;
}

message GetSimpleChannelsInfo
{
  uint32 portion = 1;
  uint32 portions_number = 2;
  string channel_statuses = 3;
}

message PassbackInfo
{
  string passback_type = 1;
  string passback_code = 2;
  string passback_url = 3;
  uint32 width = 4;
  uint32 height = 5;
  string size = 6;
  string mime_format = 7;
  bool active = 8;
}

message ColocationPropInfo
{
  bool found = 1;
  uint32 colo_id = 2;
  bytes time_offset = 3;
}

message DeliveryLimitConfigInfo
{
  repeated AccountDeliveryInfo accounts = 1;
  repeated CampaignDeliveryInfo campaigns = 2;
  repeated CCGDeliveryInfo ccgs = 3;
}

message get_configRequest
{
  CampaignGetConfigSettings get_config_settings = 1;
}

message get_configResponse
{
  CampaignConfigUpdateInfo value = 1;
}

message need_configRequest
{
  bytes req_timestamp = 1;
}

message need_configResponse
{
  bool value = 1;
}

message get_ecpmsRequest
{
  bytes request_timestamp = 1;
}

message get_ecpmsResponse
{
  repeated CampaignEcpmInfo value = 1;
}

message get_expression_channelsRequest
{
  GetExpressionChannelsInfo params = 1;
}

message get_expression_channelsResponse
{
  ExpressionChannelsInfo value = 1;
}

message get_tag_passbackRequest
{
  uint32 tag_id = 1;
  string app_format = 2;
}

message get_tag_passbackResponse
{
  PassbackInfo value = 1;
}

message brief_simple_channelsRequest
{
  GetSimpleChannelsInfo params = 1;
}

message brief_simple_channelsResponse
{
  BriefSimpleChannelAnswer value = 1;
}

message simple_channelsRequest
{
  GetSimpleChannelsInfo params = 1;
}

message simple_channelsResponse
{
  SimpleChannelAnswer value = 1;
}

message chsv_simple_channelsRequest
{
  GetSimpleChannelsInfo params = 1;
}

message chsv_simple_channelsResponse
{
  ChannelServerChannelAnswer value = 1;
}

message fraud_conditionsRequest
{
}

message fraud_conditionsResponse
{
  FraudConditionConfig value = 1;
}

message freq_capsRequest
{
}

message freq_capsResponse
{
  FreqCapConfigInfo value = 1;
}

message get_colocation_flagsRequest
{
}

message get_colocation_flagsResponse
{
  repeated ColocationFlags value = 1;
}

message detectorsRequest
{
  bytes request_timestamp = 1;
}

message detectorsResponse
{
  DetectorsConfig value = 1;
}

message update_statRequest
{
}

message update_statResponse
{
}

message get_statRequest
{
}

message get_statResponse
{
  StatInfo value = 1;
}

message get_bill_statRequest
{
}

message get_bill_statResponse
{
  BillStatInfo value = 1;
}

message get_colocation_propRequest
{
  uint32 colo_id = 1;
}

message get_colocation_propResponse
{
  ColocationPropInfo value = 1;
}

message get_delivery_limit_configRequest
{
}

message get_delivery_limit_configResponse
{
  DeliveryLimitConfigInfo value = 1;
}

service CampaignServer
{
  rpc get_config(get_configRequest) returns (get_configResponse);
  rpc need_config(need_configRequest) returns (need_configResponse);
  rpc get_ecpms(get_ecpmsRequest) returns (get_ecpmsResponse);
  rpc get_expression_channels(get_expression_channelsRequest) returns (get_expression_channelsResponse);
  rpc get_tag_passback(get_tag_passbackRequest) returns (get_tag_passbackResponse);
  rpc brief_simple_channels(brief_simple_channelsRequest) returns (brief_simple_channelsResponse);
  rpc simple_channels(simple_channelsRequest) returns (simple_channelsResponse);
  rpc chsv_simple_channels(chsv_simple_channelsRequest) returns (chsv_simple_channelsResponse);
  rpc fraud_conditions(fraud_conditionsRequest) returns (fraud_conditionsResponse);
  rpc freq_caps(freq_capsRequest) returns (freq_capsResponse);
  rpc get_colocation_flags(get_colocation_flagsRequest) returns (get_colocation_flagsResponse);
  rpc detectors(detectorsRequest) returns (detectorsResponse);
  rpc update_stat(update_statRequest) returns (update_statResponse);
  rpc get_stat(get_statRequest) returns (get_statResponse);
  rpc get_bill_stat(get_bill_statRequest) returns (get_bill_statResponse);
  rpc get_colocation_prop(get_colocation_propRequest) returns (get_colocation_propResponse);
  rpc get_delivery_limit_config(get_delivery_limit_configRequest) returns (get_delivery_limit_configResponse);
}
