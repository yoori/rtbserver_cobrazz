edition = "2023";

option features.field_presence = IMPLICIT;
option features.enum_type = OPEN;
option features.repeated_field_encoding = PACKED;
option features.utf8_validation = NONE;
option features.json_format = ALLOW;

package adserver.channel_svcs.channel_server;

service ChannelServerGrpc {
  rpc match(MatchRequest) returns (MatchResponse);
  rpc get_ccg_traits(GetCcgTraitsRequest) returns (GetCcgTraitsResponse);
  rpc check_configuration(CheckConfigurationRequest)
    returns (CheckConfigurationResponse);
  rpc set_sources(SetSourcesRequest) returns (SetSourcesResponse);
  rpc set_proxy_sources(SetProxySourcesRequest) returns (SetProxySourcesResponse);
  rpc check(CheckRequest) returns (CheckResponse);
  rpc update_triggers(UpdateTriggersRequest) returns (UpdateTriggersResponse);
  rpc update_all_ccg(UpdateAllCcgRequest) returns (UpdateAllCcgResponse);
  rpc get_count_chunks(GetCountChunksRequest) returns (GetCountChunksResponse);
}

message ChannelAtom {
  uint64 id = 1;
  uint64 trigger_channel_id = 2;
}

message TriggerMatchResult {
  // Each ChannelAtom sequence is sorted and unique by (id, trigger_channel_id).
  repeated ChannelAtom page_channels = 1;
  repeated ChannelAtom search_channels = 2;
  repeated ChannelAtom url_channels = 3;
  repeated ChannelAtom url_keyword_channels = 4;
  repeated uint64 uid_channels = 5; // Sorted and unique by channel ID.
}

message ContentChannelAtom {
  uint64 id = 1;
  uint64 weight = 2;
}

message MatchRequest {
  string request_id = 1;
  bytes first_url = 2;
  bytes first_url_words = 3;
  bytes urls = 4;
  bytes urls_words = 5;
  bytes pwords = 6;
  bytes swords = 7;
  bytes uid = 8;
  bytes statuses = 9;
  bool non_strict_word_match = 10;
  bool non_strict_url_match = 11;
  bool return_negative = 12;
  bool simplify_page = 13;
  bool fill_content = 14;
}

message MatchResponse {
  TriggerMatchResult matched_channels = 1;
  repeated ContentChannelAtom content_channels = 2;
  bool no_adv = 3;
  bool no_track = 4;
  bytes match_time = 5;
  string hostname = 6;
  bool full_loaded = 7;
}

message GetCcgTraitsRequest {
  repeated uint64 ids = 1;
}

message CcgKeyword {
  uint64 ccg_keyword_id = 1;
  uint64 ccg_id = 2;
  uint64 channel_id = 3;
  bytes max_cpc = 4;
  bytes ctr = 5;
  string click_url = 6;
  string original_keyword = 7;
}

message GetCcgTraitsResponse {
  repeated CcgKeyword ccg_keywords = 1;
  repeated uint64 neg_ccg = 2;
  string hostname = 3;
}

message CheckConfigurationRequest {}

message CheckConfigurationResponse {
  uint64 check_sum = 1;
}

message SetSourcesRequest {
  repeated string campaign_refs = 1;
  string pg_connection = 2;
  uint64 count_chunks = 3;
  uint64 colo = 4;
  string version = 5;
  uint64 check_sum = 6;
  repeated uint64 sources = 7;
}

message SetSourcesResponse {}

message LocalLoadServer {
  reserved 1;
  reserved channel_update_ref;
  string endpoint = 4;
  repeated uint64 sources = 2;
  uint64 count_chunks = 3;
}

message LocalLoadGroup {
  repeated LocalLoadServer servers = 1;
}

message SetProxySourcesRequest {
  repeated string campaign_refs = 1;
  reserved 2;
  reserved proxy_refs;
  repeated string proxy_endpoints = 9;
  repeated LocalLoadGroup local_groups = 3;
  uint64 count_chunks = 4;
  uint64 colo = 5;
  string version = 6;
  uint64 check_sum = 7;
  repeated uint64 sources = 8;
}

message SetProxySourcesResponse {}

message CheckRequest {
  uint64 colo_id = 1;
  string version = 2;
  bytes master_stamp = 3;
  repeated uint64 new_ids = 4;
  bool use_only_list = 5;
}

message ChannelVersion {
  uint64 id = 1;
  uint64 size = 2;
  bytes stamp = 3;
}

message CheckResponse {
  bytes first_stamp = 1;
  bytes master_stamp = 2;
  repeated ChannelVersion versions = 3;
  bool special_track = 4;
  bool special_adv = 5;
  int64 source_id = 6;
  bytes max_time = 7;
}

message TriggerInfo {
  uint64 channel_trigger_id = 1;
  bytes trigger = 2;
}

message ChannelById {
  uint64 channel_id = 1;
  repeated TriggerInfo words = 2;
  bytes stamp = 3;
}

message UpdateTriggersRequest {
  repeated uint64 ids = 1;
}

message UpdateTriggersResponse {
  int64 source_id = 1;
  repeated ChannelById channels = 2;
}

message UpdateAllCcgRequest {
  bytes master_stamp = 1;
  uint64 start = 2;
  uint64 limit = 3;
  repeated uint64 channel_ids = 4;
  bool use_only_list = 5;
}

message TriggerVersion {
  uint64 id = 1;
  bytes stamp = 2;
}

message UpdateAllCcgResponse {
  uint64 start_id = 1;
  repeated CcgKeyword keywords = 2;
  repeated TriggerVersion deleted = 3;
  int64 source_id = 4;
}

message GetCountChunksRequest {}

message GetCountChunksResponse {
  uint64 count_chunks = 1;
}
