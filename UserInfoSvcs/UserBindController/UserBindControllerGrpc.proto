syntax = "proto3";

package adserver.user_info_svcs.user_bind_controller;

service UserBindControllerGrpc {
  rpc get_session_description(GetSessionDescriptionRequest)
    returns (GetSessionDescriptionResponse);
}

message GetSessionDescriptionRequest {}

message UserBindDescription {
  string user_bind_server_endpoint = 1;
  repeated uint32 chunk_ids = 2;
}

message GetSessionDescriptionResponse {
  repeated UserBindDescription user_bind_servers = 1;
}
